done_statuses:
  - "Done"
  - "Closed"
  - "Concluído"
  - "Concluido"
  - "Resolved"
  - "Released"

# Número de dias sem movimento para considerar item como candidato a Ponto de Atenção
blocked_threshold_days: 5

# Número mínimo de tokens em comum para sugerir vínculo de épico a item BAU
bau_suggest_min_tokens: 2

# Palavras ignoradas na correspondência de tokens (stop words PT-BR mínimas)
bau_suggest_stop_words:
  - "de"
  - "da"
  - "do"
  - "das"
  - "dos"
  - "e"
  - "em"
  - "o"
  - "a"
  - "os"
  - "as"
  - "para"
  - "com"
  - "por"
  - "no"
  - "na"
  - "nos"
  - "nas"
  - "um"
  - "uma"
